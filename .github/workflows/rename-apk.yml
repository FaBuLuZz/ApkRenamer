name: Rename APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL to download the APK"
        required: true
      app_name:
        description: "New app name"
        required: true
      package_name:
        description: "New package name (leave empty to keep original)"
        required: false
      icon_url:
        description: "URL to download the new icon (.png)"
        required: false
      banner_url:
        description: "URL to download the new banner (.png)"
        required: false

jobs:
  rename:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Create required folders
        run: mkdir -p in icon banner out bin keys

      - name: Download APK
        run: wget -O in/app.apk "${{ github.event.inputs.apk_url }}"

      - name: Download icon
        if: ${{ github.event.inputs.icon_url != '' }}
        run: wget -O icon/icon.png "${{ github.event.inputs.icon_url }}"

      - name: Download banner
        if: ${{ github.event.inputs.banner_url != '' }}
        run: wget -O banner/banner.png "${{ github.event.inputs.banner_url }}"

      - name: Copy bin and keys
        run: |
          cp folders/bin/* bin/ 2>/dev/null || true
          cp -r folders/bin/lib64 bin/ 2>/dev/null || true
          cp folders/keys/* keys/

      - name: Make zipalign executable
        run: chmod +x bin/zipalign

      - name: Download commons-io 2.6
        run: wget -O bin/commons-io-2.6.jar "https://repo1.maven.org/maven2/commons-io/commons-io/2.6/commons-io-2.6.jar"

      - name: Patch FileUtils.delete
        run: sed -i 's/FileUtils\.delete(file)/file.delete()/g' src/ru/gavrikov/Main.java

      - name: Compile renamer.jar
        run: |
          mkdir -p compiled
          javac -cp "bin/*" -d compiled src/ru/gavrikov/Main.java
          jar cfm renamer.jar src/META-INF/MANIFEST.MF -C compiled .

      - name: Extract original package name
        id: package
        run: |
          PACKAGE="${{ github.event.inputs.package_name }}"
          if [ -z "$PACKAGE" ]; then
            java -jar bin/apktool.jar d in/app.apk -o temp_meta --no-src -f
            PACKAGE=$(grep 'package=' temp_meta/AndroidManifest.xml | head -1 | sed 's/.*package="\([^"]*\)".*/\1/')
            rm -rf temp_meta
          fi
          echo "value=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Build rename arguments
        id: args
        run: |
          ARGS="-n \"${{ github.event.inputs.app_name }}\" -p ${{ steps.package.outputs.value }}"
          if [ -f "icon/icon.png" ]; then ARGS="$ARGS -i icon/icon.png"; fi
          if [ -f "banner/banner.png" ]; then ARGS="$ARGS -b banner/banner.png"; fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run renamer
        run: eval java -cp "renamer.jar:bin/*" ru.gavrikov.Main ${{ steps.args.outputs.args }}

      - name: Upload renamed APK
        uses: actions/upload-artifact@v4
        with:
          name: renamed-apk
          path: out/*.apk
